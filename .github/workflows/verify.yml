name: Validate SC-900 Security Academy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Security and content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
      - name: Curriculum and security tests
        run: node --test tests/content.test.mjs
